name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  powershell:
    name: PowerShell syntax + PSScriptAnalyzer
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Parse every PowerShell file (syntax gate)
        shell: pwsh
        run: |
          $problems = @()
          Get-ChildItem -Recurse -Include *.ps1,*.psm1,*.psd1 -File | ForEach-Object {
            $tokens = $null
            $errs = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errs)
            if ($errs) {
              $problems += $errs | ForEach-Object { "$($_.Extent.File):$($_.Extent.StartLineNumber): $($_.Message)" }
            }
          }
          if ($problems) {
            $problems | ForEach-Object { Write-Host "::error::$_" }
            throw "PowerShell syntax errors found."
          }
          Write-Host "All PowerShell files parse cleanly."

      - name: PSScriptAnalyzer (errors fail the build)
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $issues = Invoke-ScriptAnalyzer -Path . -Recurse -Severity Error
          if ($issues) {
            $issues | Format-Table RuleName, ScriptPath, Line, Message -AutoSize | Out-String | Write-Host
            throw "PSScriptAnalyzer reported $($issues.Count) error-level issue(s)."
          }
          Write-Host "PSScriptAnalyzer: no error-level issues."

      - name: Windows PowerShell regression tests
        shell: pwsh
        run: |
          Get-ChildItem tools/bdo_meta/test_*.ps1 -File | ForEach-Object {
            & powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "Regression failed: $($_.Name)" }
          }

  data:
    name: JSON + Python validation
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Validate JSON files
        shell: pwsh
        run: |
          Get-ChildItem -Recurse -Include *.json -File |
            Where-Object { $_.FullName -notmatch 'node_modules' } |
            ForEach-Object {
              try { $null = Get-Content $_.FullName -Raw | ConvertFrom-Json }
              catch { throw "Invalid JSON: $($_.FullName) -- $_" }
            }
          Write-Host "All JSON files valid."

      - name: Compile-check Python files (if any)
        shell: pwsh
        run: |
          $py = Get-ChildItem -Recurse -Include *.py -File | Where-Object { $_.FullName -notmatch 'node_modules' }
          if ($py) {
            python -m compileall -q .\
            if ($LASTEXITCODE -ne 0) { throw "Python compile check failed." }
            Write-Host "Python files compile cleanly ($($py.Count) files)."
          } else {
            Write-Host "No Python files found; skipping."
          }

      - name: Python regression tests
        shell: pwsh
        run: |
          python -B -m unittest discover -s tools/bdo_meta -p 'test_*.py'
          if ($LASTEXITCODE -ne 0) { throw "Python regression tests failed." }
